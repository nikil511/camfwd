version: "2.4"

volumes:
  tailscale:

services:
  proxy:
    build: ./haproxy
    network_mode: host
    restart: always

  tailscale:
    build: ./tailscale
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale:/var/lib/tailscale
    labels:
      io.balena.features.kernel-modules: "1"
