global
    log stdout format raw local0 info
    maxconn 256

defaults
    log     global
    mode    http
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  1h

# ---------------------------------------------------------------------------
# Port 80: Multiplexed HTTP Reverse Proxy (Balena Public URL / LAN / Tailscale)
# ---------------------------------------------------------------------------
frontend http_mux
    bind *:80
    option httplog

    acl is_camera1_path path_beg -i /camera1
    acl is_camera2_path path_beg -i /camera2
    acl is_frigate_path path_beg -i /frigate

    acl is_camera1_ref  hdr_sub(Referer) -i /camera1
    acl is_camera2_ref  hdr_sub(Referer) -i /camera2

    use_backend camera1_mux_http if is_camera1_path
    use_backend camera2_mux_http if is_camera2_path
    use_backend frigate_mux_http if is_frigate_path
    use_backend camera1_direct_http if is_camera1_ref
    use_backend camera2_direct_http if is_camera2_ref
    default_backend router_http

backend camera1_mux_http
    http-request replace-path ^/camera1/?(.*)$ /\1
    http-request set-header Host ${CAMERA1_HOST}
    server cam1 ${CAMERA1_HOST}

backend camera2_mux_http
    http-request replace-path ^/camera2/?(.*)$ /\1
    http-request set-header Host ${CAMERA2_HOST}
    server cam2 ${CAMERA2_HOST}

backend frigate_mux_http
    http-request replace-path ^/frigate/?(.*)$ /\1
    server frigate ${FRIGATE_HOST}

backend router_http
    http-request set-header Host ${ROUTER_HOST}
    server router ${ROUTER_HOST}

# ---------------------------------------------------------------------------
# Dedicated HTTP Ports for Camera Web UIs & Hikvision ISAPI (:8081, :8082)
# ---------------------------------------------------------------------------
frontend camera1_http_in
    bind *:8081
    default_backend camera1_direct_http

backend camera1_direct_http
    http-request set-header Host ${CAMERA1_HOST}
    server cam1 ${CAMERA1_HOST}

frontend camera2_http_in
    bind *:8082
    default_backend camera2_direct_http

backend camera2_direct_http
    http-request set-header Host ${CAMERA2_HOST}
    server cam2 ${CAMERA2_HOST}

# ---------------------------------------------------------------------------
# TCP RTSP Forwarders for Remote Frigate (via Balena Tunnel or Tailscale)
#   Camera 1 RTSP: ports 5541 and 8554 -> ${CAMERA1_RTSP_HOST}
#   Camera 2 RTSP: ports 5542 and 8555 -> ${CAMERA2_RTSP_HOST}
# ---------------------------------------------------------------------------
listen camera1_rtsp
    bind *:5541
    bind *:8554
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    server cam1_rtsp ${CAMERA1_RTSP_HOST} check inter 30s fall 3 rise 1

listen camera2_rtsp
    bind *:5542
    bind *:8555
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    server cam2_rtsp ${CAMERA2_RTSP_HOST} check inter 30s fall 3 rise 1
